# Monumental Recovery Foundation — Netlify configuration

[build]
  # Publish only the public website files. Netlify copies them into _site/ on every deploy,
  # so internal files (README.md, tools/, netlify/functions/ source) are never online.
  # New top-level public files (anything besides .html pages and assets/) must be added here.
  # The command stops on any error, and a failed deploy leaves the live site untouched.
  command = "rm -rf _site && mkdir _site && cp *.html style.css main.js robots.txt sitemap.xml _site/ && cp -R assets gala _site/"
  publish = "_site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Never let the function source be served as a static file.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# The PDF generator lives in the repo but should not be served.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# SEO-fix backups live in the repo folder but should not be served.
[[redirects]]
  from = "/_seo-backups/*"
  to = "/404.html"
  status = 404
  force = true

# The README holds internal setup notes and should not be served.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Guest app (gala/): the service worker must always be re-checked so app
# updates reach phones that have it installed.
[[headers]]
  for = "/gala/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The guest app is unlisted until launch: keep every page and file out of search results.
[[headers]]
  for = "/gala/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
