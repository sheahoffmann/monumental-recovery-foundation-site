<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Playfair+Display:ital,wght@0,800;1,700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, DUR = 16;
const C = { deep: '#1b2442', navy: '#2e3d68', navyDeep: '#232f52', soft: '#4a5885', creme: '#f1ebdc', gold: '#b38b4d' };
const cv = document.getElementById('c'), x = cv.getContext('2d');
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });

const ease = t => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);
// 0→1 fade in over [a, a+0.8], 1→0 fade out over [b-0.6, b]
const vis = (t, a, b) => Math.min(ease((t - a) / 0.8), b == null ? 1 : ease((b - t) / 0.6));

function scene(t) {
  const sky = x.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, C.deep); sky.addColorStop(0.6, C.navy);
  sky.addColorStop(0.85, '#8c6a4a'); sky.addColorStop(1, '#d9b47a');
  x.fillStyle = sky; x.fillRect(0, 0, W, H);
  // sun rises over the whole clip
  const sy = 1720 - 260 * ease(t / DUR);
  const g = x.createRadialGradient(640, sy, 0, 640, sy, 560);
  g.addColorStop(0, 'rgba(246,227,184,.95)'); g.addColorStop(.35, 'rgba(226,187,124,.5)'); g.addColorStop(1, 'rgba(179,139,77,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const ridge = (pts, color, lift, alpha = 1) => {
    x.globalAlpha = alpha; x.fillStyle = color; x.beginPath(); x.moveTo(0, H);
    pts.forEach(([px, py]) => x.lineTo(px, py + 570 + lift)); x.lineTo(W, H); x.closePath(); x.fill(); x.globalAlpha = 1;
  };
  const rise = k => 220 * (1 - ease(t / 2.2 - k));
  ridge([[0,1010],[140,930],[260,975],[420,860],[560,950],[700,880],[860,960],[1080,900]], C.soft, rise(0), .75);
  ridge([[0,1110],[180,990],[300,1050],[470,920],[610,1040],[760,960],[930,1060],[1080,1000]], C.navy, rise(.15));
  ridge([[0,1200],[220,1090],[380,1150],[560,1060],[720,1160],[900,1100],[1080,1170]], C.navyDeep, rise(.3));
}

// Draws rich text: segments [[text, italicGold?], ...], wrapped to maxW
function rich(segs, y, size, alpha, maxW = 880, lh = 1.08) {
  x.globalAlpha = alpha;
  const words = [];
  segs.forEach(([s, it]) => s.split(' ').forEach(w => w && words.push([w, it])));
  const font = it => it ? `italic 700 ${size}px "Playfair Display"` : `800 ${size}px "Playfair Display"`;
  let line = [], lw = 0, lines = [];
  for (const [w, it] of words) {
    x.font = font(it); const ww = x.measureText(w + ' ').width;
    if (lw + ww > maxW && line.length) { lines.push(line); line = []; lw = 0; }
    line.push([w, it, ww]); lw += ww;
  }
  lines.push(line);
  lines.forEach((ln, i) => {
    let cx = 100;
    ln.forEach(([w, it, ww]) => { x.font = font(it); x.fillStyle = it ? C.gold : C.creme; x.fillText(w, cx, y + i * size * lh); cx += ww; });
  });
  x.globalAlpha = 1;
  return y + lines.length * size * lh;
}
function body(text, y, size, alpha, maxW = 860) {
  x.globalAlpha = alpha; x.font = `400 ${size}px Karla`; x.fillStyle = C.creme;
  let line = '', n = 0;
  for (const w of text.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (x.measureText(test).width > maxW && line) { x.fillText(line, 100, y + n++ * size * 1.4); line = w; } else line = test;
  }
  x.fillText(line, 100, y + n * size * 1.4); x.globalAlpha = 1;
}
function eyebrow(text, y, alpha) {
  x.globalAlpha = alpha; x.font = '700 30px Karla'; x.fillStyle = C.gold;
  x.letterSpacing = '7px'; x.fillText(text.toUpperCase(), 100, y); x.letterSpacing = '0px'; x.globalAlpha = 1;
}

let icon, logo;
function frame(t) {
  scene(t);
  // 1: 0.4 – 4.4
  let a = vis(t, 0.4, 4.4);
  if (a > 0) { eyebrow('Every family knows this moment', 420, a); rich([['The window is'], ['short.', 1]], 580, 150, a); }
  // 2: 4.6 – 8.6
  a = vis(t, 4.6, 8.6);
  if (a > 0) { const e = rich([['When a man is'], ['finally ready,', 1]], 480, 110, a); body('the answer shouldn’t depend on what he can pay.', e + 40, 54, a); }
  // 3: 8.8 – 12.6
  a = vis(t, 8.8, 12.6);
  if (a > 0) {
    const n = Math.round(100 * ease((t - 8.8) / 1.6));
    x.globalAlpha = a; x.font = '800 300px "Playfair Display"'; x.fillStyle = C.gold; x.fillText(n + '%', 90, 680);
    rich([['of scholarship funds go'], ['straight to treatment.', 1]], 820, 84, a);
    body('Paid directly to approved programs. Never as cash.', 1080, 46, a * .9);
  }
  // 4: 12.8 – end
  a = vis(t, 12.8);
  if (a > 0) {
    x.globalAlpha = a; x.drawImage(icon, 100, 300, 130, 130);
    rich([['Give a man'], ['a chance.', 1]], 620, 140, a);
    x.globalAlpha = a; x.font = '700 50px Karla'; x.fillStyle = C.gold; x.fillText('monumentalrecovery.org', 100, 980);
    const lw = 560, lh = lw * logo.height / logo.width;
    x.drawImage(logo, 100, 1660, lw, lh); x.globalAlpha = 1;
  }
}

(async () => {
  await document.fonts.load('800 100px "Playfair Display"');
  await document.fonts.load('italic 700 100px "Playfair Display"');
  await document.fonts.load('400 40px Karla'); await document.fonts.load('700 40px Karla');
  [icon, logo] = await Promise.all([load('icon-creme.png'), load('logo-creme.png')]);
  if (location.hash === '#still') { frame(parseFloat(new URLSearchParams(location.search).get('t') || 14)); return; }
  window.__ready = true;
})();

window.record = () => new Promise(resolve => {
  const mime = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9'].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(cv.captureStream(30), { mimeType: mime, videoBitsPerSecond: 12e6 });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = async () => {
    const buf = new Uint8Array(await new Blob(chunks).arrayBuffer());
    let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    window.__video = { mime, b64: btoa(s) }; resolve(mime);
  };
  frame(0); rec.start();
  const t0 = performance.now();
  (function tick() {
    const t = (performance.now() - t0) / 1000;
    frame(Math.min(t, DUR));
    if (t < DUR) requestAnimationFrame(tick); else rec.stop();
  })();
});
</script>
</body>
</html>
